server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    client_max_body_size 1m;

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Astro emits hashed assets in /_astro/. Use ^~ so the generic asset
    # regex below does not override the immutable cache policy.
    location ^~ /_astro/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        return 301 /sitemap-index.xml;
    }

    location / {
        # Serve directory output (/projects/index.html) directly in both
        # /projects and /projects/ forms without an extra redirect.
        # The $uri.html fallback keeps file output working too.
        expires -1;
        try_files $uri $uri/index.html $uri.html =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location ~* \.html$ {
        expires -1;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* ^/(xmlrpc\.php|wp-login\.php|wp-admin(?:/|$)|wp-content(?:/|$)|wp-includes(?:/|$)) {
        return 404;
    }

    location ~* \.php$ {
        return 404;
    }

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://analytics.luisjcenteno.dev; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://analytics.luisjcenteno.dev" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
}
