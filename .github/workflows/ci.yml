name: CI

on:
  push:
    branches:
      - master
      - migrate/astro
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Check, lint, build, SEO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Astro diagnostics
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: SEO and link audit
        run: bun run check:seo

      - name: Validate Docker build
        run: docker build .

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run smoke tests
        run: bun run test:e2e

      - name: Stop containers
        if: always()
        run: docker compose down
